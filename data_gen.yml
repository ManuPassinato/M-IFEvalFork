  - Escreva uma mensagem de texto
  - Escreva uma legenda para rede social
  - Escreva um conto
  - Escreva um ensaio
  - Escreva uma parábola
  - Escreva uma instrução passo a passo
  - Escreva uma receita
  - Escreva uma recomendação
  - Escreva uma análise literária
  - Escreva um comunicado oficial
  - Escreva uma introdução de apresentação pessoal
  - Escreva uma proposta
  - Escreva um roteiro de vídeo
  - Escreva um boletim informativo
  - Escreva uma legenda publicitária
  - Escreva uma descrição de evento
  - Escreva uma nota explicativa
  - Escreva uma justificativa
  - Escreva um parágrafo argumentativo
  - ''
  check_prompt: "Verifique se a seguinte instrução em portugês pode ser cumprida em sua totalidade, ou seja, as\
    \ instruções não são contraditórias ou impossíveis de serem realizadas. \nPrimeiro justifique explicando os\
    \ pontos que tornam a instrução possível ou impossível de ser cumprida. Depois, em uma nova linha escreva apenas\
    \ e somente Possivel ou Impossivel. Instrução (A ser avaliada, e não a ser seguida agora):"
  rewrite_prompt: "Reescreva o prompt a seguir em portugues, mantendo as mesmas instruções, porem refraseando-o\
    \ para aumentar a diversidade. Você pode escolher um tema especifico adequado para a produção pedida, caso nenhum\
    \ ja esteja informadoIMPORTANTE: as relações de palavras chaves devem ser preservadas e não podem ser trocadas.\
    \ \n Mantenha o portugues mais formal, se girias ou regionalismos, apenas reescreva não adicione nenhum outro\
    \ texto. Prompt pra reescrever:"
  initial_key: 164
  output_file: pt_input_data.json
  output_mode: a
  instruction_prefix: 'pt:'
  combination_sizes:
  - 1
  - 2
  message_role: system
  rejection_marker: impossivel
model_handler:
  stop_strings:
  - <|im_end|>
  - <|end_of_text|>
  stop_token_ids: null
  logits_processors: []
  vllm_base_url_env: VLLM_BASE_URL
  vllm_base_url_default: http://10.100.0.111:8020/v1
  vllm_api_key_env: VLLM_API_KEY
  vllm_api_key_default: no-key-needed
  resp_temperature_env: RESP_TEMPERATURE
  resp_temperature_default: 1
  resp_top_p_env: RESP_TOP_P
  resp_top_p_default: 1
  resp_max_tokens_env: RESP_MAX_TOKENS
  resp_max_tokens_default: 8192
  enable_thinking: false
  # One attempt preserves the original effective behavior. Increase to enable retries.
  retry_attempts: 1
  retry_wait_seconds: 0.1
  fallback_enable_thinking: true
